<!DOCTYPE html>
<html>
<head>
<title>Simple Expense Tracker</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f0f0f0;
    padding: 20px;
  }
  .container {
    max-width: 500px;
    margin: 0 auto;
    background: white;
    padding: 20px;
    border-radius: 8px;
  }
  h1 {
    text-align: center;
    color: #333;
  }
  input, select {
    width: 100%;
    padding: 8px;
    margin: 5px 0;
    font-size: 16px;
  }
  button {
    width: 100%;
    padding: 10px;
    background: #4CAF50;
    color: white;
    border: none;
    font-size: 16px;
    margin-top: 5px;
    cursor: pointer;
  }
  #total {
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    margin: 15px 0;
  }
  ul {
    list-style: none;
    padding: 0;
  }
  li {
    display: flex;
    justify-content: space-between;
    padding: 8px;
    border-bottom: 1px solid #ddd;
  }
  li button {
    width: auto;
    background: red;
    padding: 2px 8px;
    margin: 0;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Expense Tracker</h1>

  <div id="total">Total Spent: &#8377;0</div>

  <input type="text" id="name" placeholder="What did you buy?">
  <input type="number" id="amount" placeholder="Amount (₹)">
  <select id="category">
    <option>Food</option>
    <option>Transport</option>
    <option>Books</option>
    <option>Fun</option>
    <option>Other</option>
  </select>
  <button onclick="addExpense()">Add Expense</button>

  <ul id="list"></ul>
</div>

<script>
  var expenses = [];

  function addExpense() {
    var name = document.getElementById("name").value;
    var amount = Number(document.getElementById("amount").value);
    var category = document.getElementById("category").value;

    if (name === "" || amount <= 0) {
      alert("Please enter a name and amount");
      return;
    }

    expenses.push({ name: name, amount: amount, category: category });

    document.getElementById("name").value = "";
    document.getElementById("amount").value = "";

    updateList();
  }

  function deleteExpense(index) {
    expenses.splice(index, 1);
    updateList();
  }

  function updateList() {
    var list = document.getElementById("list");
    list.innerHTML = "";

    var total = 0;

    for (var i = 0; i < expenses.length; i++) {
      var e = expenses[i];
      total = total + e.amount;

      var li = document.createElement("li");
      li.innerHTML = "<span>" + e.name + " (" + e.category + ") - ₹" + e.amount +
        "</span> <button onclick='deleteExpense(" + i + ")'>X</button>";
      list.appendChild(li);
    }

    document.getElementById("total").innerHTML = "Total Spent: &#8377;" + total;
  }
</script>

</body>
</html>
